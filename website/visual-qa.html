<!doctype html><meta charset="utf-8"><title>Floating models visual review</title><style>html,body{margin:0;background:#f8f9f5}iframe{display:block;border:0}aside{position:fixed;left:calc(var(--width) + 22px);top:20px;font:14px system-ui;color:#34462e;width:220px}button{padding:8px;margin:4px}a{display:block;padding:8px}</style><iframe title="Responsive model preview"></iframe><aside><p>Local visual review</p><div id="steps"></div><button id="theme">Light / dark</button></aside><script>const q=new URLSearchParams(location.search),f=document.querySelector('iframe'),w=+(q.get('width')||390),h=+(q.get('height')||844),stage=q.get('stage')||'read';document.documentElement.style.setProperty('--width',w+'px');f.width=w;f.height=h;f.src=q.get('reduce')?'/reduced-qa.html':'/';const ids=['read','model','write','pair','sync','remind','jump'];for(const id of ids){const b=document.createElement('button');b.textContent=id;b.onclick=()=>f.contentDocument.getElementById('wf-tab-'+id).click();document.querySelector('#steps').append(b)}let dark=false;document.querySelector('#theme').onclick=()=>{dark=!dark;const s=f.contentDocument.querySelector('.theme-select');s.value=dark?'dark':'light';s.dispatchEvent(new Event('change',{bubbles:true}))};f.onload=()=>{const ready=()=>{const b=f.contentDocument.getElementById('wf-tab-'+stage);if(!b){setTimeout(ready,100);return}setTimeout(()=>b.click(),600)};ready()};</script>
