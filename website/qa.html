<!doctype html><meta charset="utf-8"><title>PNC two-axis QA</title><style>body{font:14px system-ui;background:#ddd;margin:16px}button{margin:0 8px 10px 0;padding:8px}iframe{border:0;display:block;background:white;transform-origin:top left}#stage{position:relative}pre{white-space:pre-wrap;max-height:300px;overflow:auto}#results{max-width:1100px}</style>
<button id="run">Run viewport matrix</button><button id="gesture">Run interaction checks</button><button data-size="1440,900">Desktop</button><button data-size="390,844">Mobile</button><button data-size="320,568">Small mobile</button><button data-size="844,390">Landscape</button><button id="zoom">200% text</button><button id="dark">Dark theme</button><button id="focuscheck">Check reflow focus</button><pre id="results">Ready</pre><div id="stage"><iframe id="preview" src="/" width="1440" height="900" style="transform:scale(.7)"></iframe></div>
<script>
const f=document.querySelector('iframe'),r=document.querySelector('#results'),sleep=ms=>new Promise(a=>setTimeout(a,ms));let zoomed=false;
async function size(w,h,scale=1){f.width=w;f.height=h;f.style.transform='scale(.7)';document.querySelector('#stage').style.height=h*.7+'px';f.src='/?qa='+Math.random();await new Promise(a=>f.onload=a);f.contentDocument.documentElement.style.fontSize=16*scale+'px';await sleep(850);for(let i=0;i<15&&inspect().errors.length;i++)await sleep(300)}
function inspect(){const d=f.contentDocument,w=f.contentWindow;return{chapters:d.querySelectorAll('.screen').length,slides:d.querySelectorAll('.chapter-slide').length,width:w.innerWidth,height:w.innerHeight,scrollWidth:d.documentElement.scrollWidth,errors:[...d.querySelectorAll('.chapter-slide')].flatMap((s,i)=>{const b=s.getBoundingClientRect(),c=s.querySelector('.screen-content').getBoundingClientRect(),style=w.getComputedStyle(s),top=parseFloat(style.paddingTop),bottom=parseFloat(style.paddingBottom),max=b.height-top-bottom;return c.height>max+1?[{slide:i,key:s.dataset.slideKey,available:max,height:c.height,blocks:[...s.querySelectorAll('.content-block')].map(x=>[x.dataset.block,x.getBoundingClientRect().height])}]:[]}),overflow:[...d.querySelectorAll('.content-block')].filter(el=>el.scrollWidth>el.clientWidth+1).map(el=>el.dataset.block)}}
for(const b of document.querySelectorAll('[data-size]'))b.onclick=async()=>{await size(...b.dataset.size.split(',').map(Number));r.textContent='Preview: '+f.width+' × '+f.height+'\n'+JSON.stringify(inspect())};
document.querySelector('#zoom').onclick=async()=>{zoomed=!zoomed;f.contentDocument.documentElement.style.fontSize=zoomed?'32px':'16px';await sleep(850);r.textContent=JSON.stringify(inspect(),null,2)};
document.querySelector('#dark').onclick=()=>{const select=f.contentDocument.querySelector('.theme-select');select.value='dark';select.dispatchEvent(new Event('change',{bubbles:true}))};
document.querySelector('#run').onclick=async()=>{r.textContent='Running';let rows=[];for(const [w,h,scale] of [[1440,900,1],[1280,720,1],[1024,768,1],[390,844,1],[375,667,1],[320,568,1],[844,390,1],[1440,900,2],[390,844,2],[320,568,2]]){await size(w,h,scale);rows.push({w,h,scale,...inspect()});const d=f.contentDocument;[...d.querySelectorAll('button')].find(x=>x.textContent.includes('查看解析')).click();await sleep(850);for(let i=0;i<15&&inspect().errors.length;i++)await sleep(300);rows.push({w,h,scale,expanded:true,...inspect()});r.textContent=JSON.stringify(rows,null,2)}r.textContent='DONE\n'+JSON.stringify(rows,null,2)};
document.querySelector('#gesture').onclick=async()=>{await size(390,844);const w=f.contentWindow,d=f.contentDocument,log=[];const check=(name,pass,extra={})=>log.push({name,pass,...extra}),pos=()=>Math.round(w.scrollY),current=()=>d.querySelector('.screen[data-active=true] .chapter-slide[data-active=true]');const send=(type,x,y,count=1)=>{const t=new w.Touch({identifier:1,target:d.body,clientX:x,clientY:y});d.body.dispatchEvent(new w.TouchEvent(type,{touches:count?[t]:[],changedTouches:[t],bubbles:true,cancelable:true}))};
 send('touchstart',150,400);send('touchmove',150,365);check('damped vertical follow',pos()>0&&pos()<35,{pos:pos()});send('touchend',150,365,0);await sleep(200);check('not instant',pos()>0&&pos()<844);await sleep(350);check('440ms settles second chapter',pos()===844,{pos:pos()});
 check('preview toolbar and demo together',d.querySelector('.tabs').getBoundingClientRect().top>=0&&current().querySelector('.demo-card')!==null);
 const before=current().dataset.slideKey;send('touchstart',250,350);send('touchmove',150,345);send('touchend',150,345,0);await sleep(600);check('horizontal swipe, no vertical drift',pos()===844&&current().dataset.slideKey!==before,{key:current().dataset.slideKey});
 d.querySelector('#tab-settings').click();await sleep(600);check('tab switches directly to matching demo',current().dataset.feature==='settings'&&!!current().querySelector('.model-note'));check('toolbar remains in viewport',d.querySelector('.tabs').getBoundingClientRect().top>=0&&d.querySelector('.tabs').getBoundingClientRect().bottom<844);
 const activeKey=current().dataset.slideKey;d.querySelector('[role=slider]').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true,cancelable:true}));await sleep(100);check('slider arrows do not page',current().dataset.slideKey===activeKey);
 d.querySelector('#tab-assistance').click();await sleep(600);check('return tab needs no vertical scroll',pos()===844&&current().dataset.feature==='assistance');
 [...d.querySelectorAll('button')].find(x=>x.textContent.includes('查看解析')).click();await sleep(850);check('expanded panels fit',inspect().errors.length===0,inspect());
 w.dispatchEvent(new w.CustomEvent('pnc:navigate',{detail:{index:2}}));await sleep(550);w.dispatchEvent(new w.CustomEvent('pnc:navigate',{detail:{index:1}}));await sleep(550);check('vertical chapter remembers horizontal panel',current().dataset.feature==='assistance');
 const blocks=[...current().querySelectorAll('.content-block')];check('staggered entry uses separate delays',blocks.length<2||w.getComputedStyle(blocks[0]).animationDelay!==w.getComputedStyle(blocks[1]).animationDelay);
 check('inactive horizontal panels inaccessible',[...d.querySelectorAll('.chapter-slide:not([data-active=true])')].every(s=>s.inert&&s.getAttribute('aria-hidden')==='true'));
 w.dispatchEvent(new w.CustomEvent('pnc:navigate',{detail:{index:0}}));await sleep(550);send('touchstart',180,400);send('touchmove',170,300);send('touchmove',50,290);send('touchend',50,290,0);await sleep(600);check('diagonal stays locked to first axis',pos()===844);
 r.textContent='INTERACTIONS DONE\n'+JSON.stringify(log,null,2)};
</script>

<script>document.querySelector('#focuscheck').onclick=async()=>{await size(390,844);const d=f.contentDocument,w=f.contentWindow;d.querySelector('#tab-settings').click();await sleep(600);const slider=d.querySelector('[role=slider]');slider.focus();const origin=slider.closest('.content-block').dataset.originBlock;f.width=320;f.height=568;d.documentElement.style.fontSize='32px';await sleep(1100);const active=d.activeElement;const log={focusPreserved:active.getAttribute('role')==='slider'&&active.closest('.content-block')?.dataset.originBlock===origin,focusedSlideActive:active.closest('.chapter-slide')?.dataset.active==='true',focusedChapterAligned:active.closest('.screen')?.getBoundingClientRect().top===0,...inspect()};d.documentElement.style.fontSize='16px';f.width=390;f.height=844;await sleep(1100);log.resetFocus=d.activeElement.getAttribute('role')==='slider';log.resetSlideActive=d.activeElement.closest('.chapter-slide')?.dataset.active==='true';r.textContent='FOCUS DONE\n'+JSON.stringify(log,null,2)};</script><script>
const workflowButton=document.createElement('button');workflowButton.id='workflow-check';workflowButton.textContent='Run continuous workflow checks';document.querySelector('#run').after(workflowButton);
workflowButton.onclick=async()=>{
 await size(1440,900);r.textContent='RUNNING CONTINUOUS';const d=f.contentDocument,w=f.contentWindow,log=[],check=(name,pass,extra={})=>log.push({name,pass,...extra});
 const root=kind=>d.getElementById('wf-panel-'+kind),settle=async(el,position)=>{const until=performance.now()+8000;do{await sleep(120)}while((el.dataset.travelling==='true'||Math.abs(+el.dataset.camera-position)>.001)&&performance.now()<until)},go=async(id,delay=0)=>{d.getElementById('wf-tab-'+id).click();const ids=['read','model','write'].includes(id)?['read','model','write']:['pair','sync','remind','jump'];await sleep(delay);await settle(root(ids.length===3?'pnc':'helper'),ids.indexOf(id))},button=(el,text)=>[...el.querySelectorAll('button')].find(x=>x.textContent.includes(text));
 await go('read',750);const pncCanvas=root('pnc').querySelector('canvas');
 for(const id of ['read','model','write','pair','sync','remind','jump']){await go(id);const kind=['read','model','write'].includes(id)?'pnc':'helper',el=root(kind);check('persistent stage '+id,el.dataset.stage===id&&['webgl','software'].includes(el.dataset.renderer));check('one screen for '+id,d.querySelectorAll('#'+(kind==='pnc'?'rhythm':'helper')+' .chapter-slide').length===1);check('all models remain in world '+id,+el.dataset.models===(kind==='pnc'?3:4)&&+el.dataset.objectCount>100);if(kind==='pnc')check('same PNC canvas '+id,el.querySelector('canvas')===pncCanvas);}
 const helper=root('helper');button(helper,'点击示意通知').click();await sleep(150);check('notification opens local destination',helper.querySelector('.wf3d-jump').getAttribute('aria-pressed')==='true'&&w.location.pathname==='/');button(helper,'返回示意通知').click();await sleep(150);check('notification reverses',helper.querySelector('.wf3d-jump').getAttribute('aria-pressed')==='false');
 await go('read');const el=root('pnc'),canvas=el.querySelector('canvas');d.getElementById('wf-tab-model').click();await sleep(400);button(el,'暂停').click();await sleep(130);const mid=+el.dataset.camera,t=el.dataset.time;check('camera has intermediate 3D pose',mid>0&&mid<1,{mid});await sleep(400);check('pause freezes camera and model',+el.dataset.camera===mid&&el.dataset.time===t);button(el,'继续').click();await settle(el,1);check('camera reaches processor',Math.abs(+el.dataset.camera-1)<.001&&el.querySelector('canvas')===canvas,{camera:el.dataset.camera,time:el.dataset.time,travelling:el.dataset.travelling});
 d.getElementById('wf-tab-write').click();await sleep(250);d.getElementById('wf-tab-read').click();await settle(el,0);check('rapid reversal retargets current pose',Math.abs(+el.dataset.camera)<.001&&el.dataset.stage==='read',{camera:el.dataset.camera,time:el.dataset.time,travelling:el.dataset.travelling});
 button(el,'详细说明').click();await sleep(120);const dialog=el.querySelector('dialog'),frozen=el.dataset.time;check('detail opens accessible modal',dialog.open);await sleep(300);check('reading pauses automatic tour',el.dataset.time===frozen);dialog.querySelector('button').click();await sleep(100);check('detail closes and restores focus',!dialog.open&&d.activeElement===button(el,'详细说明'));
 await go('model');button(el,'缓存命中').click();await sleep(150);check('cache bypass remains selectable',button(el,'缓存命中').getAttribute('aria-pressed')==='true');
 d.getElementById('wf-tab-model').dispatchEvent(new w.KeyboardEvent('keydown',{key:'Home',bubbles:true,cancelable:true}));await settle(el,0);check('keyboard selects camera stop',el.dataset.stage==='read'&&d.activeElement.id==='wf-tab-read');
 check('workflow has no horizontal pager',w.getComputedStyle(d.querySelector('.horizontal-nav')).display==='none');check('inactive journey stops',root('helper').dataset.renderer==='idle'&&root('helper').dataset.running==='false');
 canvas.dispatchEvent(new Event('webglcontextlost',{cancelable:true}));await sleep(100);check('context loss gives fallback',el.dataset.renderer==='fallback');canvas.dispatchEvent(new Event('webglcontextrestored'));await sleep(100);check('context restored',['webgl','software'].includes(el.dataset.renderer));
 check('workflow viewport fits',inspect().errors.length===0&&inspect().overflow.length===0,inspect());r.textContent='CONTINUOUS DONE\n'+JSON.stringify(log,null,2);
};
</script>
