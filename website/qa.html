<!doctype html><meta charset="utf-8"><title>PNC viewport QA</title><style>body{font:14px system-ui;background:#ddd;margin:16px}button{margin:0 8px 10px 0;padding:8px}iframe{border:0;display:block;background:white;transform-origin:top left}#stage{position:relative}pre{white-space:pre-wrap}#results{max-width:1100px}</style>
<button id="run">Run viewport matrix</button><button data-size="1440,900">Desktop</button><button data-size="390,844">Mobile</button><button data-size="320,568">Small mobile</button><button data-size="844,390">Landscape</button><button id="zoom">200% text</button><button id="focuscheck">Check reflow focus</button><button id="variants">Run enlarged demo matrix</button><button id="touch">Run touch checks</button><button id="gesture">Run interaction checks</button><pre id="results">Ready</pre><div id="stage"><iframe id="preview" src="/" width="1440" height="900" style="transform:scale(.7)"></iframe></div>
<script>
const f=document.querySelector('iframe'),r=document.querySelector('#results'),sleep=ms=>new Promise(a=>setTimeout(a,ms));let zoomed=false;
async function size(w,h,scale=1){f.width=w;f.height=h;f.style.transform='scale(.7)';document.querySelector('#stage').style.height=h*.7+'px';f.src='/?qa='+Math.random();await new Promise(a=>f.onload=a);f.contentDocument.documentElement.style.fontSize=16*scale+'px';await sleep(300)}
function inspect(){const d=f.contentDocument,w=f.contentWindow;return{count:d.querySelectorAll('.screen').length,width:w.innerWidth,height:w.innerHeight,scrollWidth:d.documentElement.scrollWidth,errors:[...d.querySelectorAll('.screen')].flatMap((s,i)=>{const b=s.getBoundingClientRect(),c=s.querySelector('.screen-content').getBoundingClientRect(),style=w.getComputedStyle(s),top=parseFloat(style.paddingTop),bottom=parseFloat(style.paddingBottom);return c.height>b.height-top-bottom+1?[{page:i,available:b.height-top-bottom,height:c.height,blocks:[...s.querySelectorAll('.content-block')].map(x=>[x.dataset.block,x.getBoundingClientRect().height])}]:[]})}}
document.querySelector('#run').onclick=async()=>{r.textContent='Running';let rows=[];for(const [w,h,scale] of [[1440,900,1],[1280,720,1],[1024,768,1],[390,844,1],[375,667,1],[320,568,1],[844,390,1],[1440,900,2],[390,844,2],[320,568,2]]){await size(w,h,scale);rows.push({w,h,scale,...inspect()});r.textContent=JSON.stringify(rows,null,2)}r.textContent='DONE\n'+r.textContent};
for(const b of document.querySelectorAll('[data-size]'))b.onclick=async()=>{await size(...b.dataset.size.split(',').map(Number));r.textContent='Preview: '+f.width+' × '+f.height};
document.querySelector('#zoom').onclick=async()=>{zoomed=!zoomed;f.contentDocument.documentElement.style.fontSize=zoomed?'32px':'16px';await sleep(300);r.textContent='Preview: '+f.width+' × '+f.height};
document.querySelector('#gesture').onclick=async()=>{await size(390,844);const w=f.contentWindow,d=f.contentDocument;const log=[];const check=(name,pass,extra)=>log.push({name,pass,...extra});const pos=()=>Math.round(w.scrollY);let before=pos();d.body.dispatchEvent(new w.WheelEvent('wheel',{deltaY:25,bubbles:true,cancelable:true}));await sleep(25);check('wheel damping',pos()>before&&pos()<before+25,{pos:pos()});await sleep(350);check('not instant',pos()>0&&pos()<844,{pos:pos()});await sleep(500);check('one page settles',pos()===844,{pos:pos()});d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:'PageDown',bubbles:true,cancelable:true}));await sleep(400);d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Shift',bubbles:true}));await sleep(450);check('modifier does not interrupt',pos()===1688,{pos:pos()});d.body.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Home',bubbles:true,cancelable:true}));await sleep(800);check('Home',pos()===0,{pos:pos()});d.querySelector('a[href="#install"]').click();await sleep(800);check('anchor whole page',pos()%844===0&&d.querySelector('#install').getBoundingClientRect().top===0,{pos:pos()});d.querySelector('a[href="#experience"]').click();await sleep(800);d.querySelector('#tab-assistance').click();await sleep(300);const answer=[...d.querySelectorAll('button')].find(x=>x.textContent.includes('查看解析'));answer.click();await sleep(300);check('answer reveal',!d.querySelector('#sample-answer').hidden,{});check('expanded content fits',inspect().errors.length===0,inspect());d.querySelector('#tab-settings').click();await sleep(300);[...d.querySelectorAll('[role="radio"]')].find(x=>x.textContent==='MiMo').click();await sleep(100);check('provider switch',d.querySelector('.model-note b').textContent==='MiMo',{});check('settings fits',inspect().errors.length===0,inspect());r.textContent='INTERACTIONS\n'+JSON.stringify(log,null,2)};
</script>
<script>
document.querySelector('#variants').onclick=async()=>{let out=[];r.textContent='RUNNING VARIANTS';for(const [w,h,scale] of [[320,568,1],[844,390,1],[390,844,2],[320,568,2]]){await size(w,h,scale);for(const tab of ['assistance','settings','catalogue']){f.contentDocument.querySelector('#tab-'+tab)?.click();await sleep(400);if(tab==='assistance'){[...f.contentDocument.querySelectorAll('button')].find(x=>x.textContent.includes('查看解析')).click();await sleep(400)}const d=f.contentDocument;const contentPresent=tab==='assistance'?d.querySelector('code')?.textContent.includes('indexOf')&&d.body.textContent.includes('答案　B：1'):tab==='settings'?!!d.querySelector('[role=slider]')&&!!d.querySelector('.model-note'):d.body.textContent.includes('字符串与常用类')&&d.body.textContent.includes('异常处理');out.push({w,h,scale,tab,contentPresent,...inspect()});r.textContent=JSON.stringify(out,null,2)}}r.textContent='VARIANTS DONE\n'+JSON.stringify(out,null,2)};
document.querySelector('#touch').onclick=async()=>{await size(390,844);const w=f.contentWindow,d=f.contentDocument,log=[];const check=(name,pass,extra)=>log.push({name,pass,...extra}),pos=()=>Math.round(w.scrollY);const send=(type,y,touches=1)=>{const point=new w.Touch({identifier:1,target:d.body,clientX:150,clientY:y});d.body.dispatchEvent(new w.TouchEvent(type,{touches:touches?[point]:[],changedTouches:[point],bubbles:true,cancelable:true}))};send('touchstart',400);send('touchmove',370);check('touch drag damped',pos()>0&&pos()<30,{pos:pos()});send('touchend',370,0);await sleep(350);check('touch release animating',pos()>0&&pos()<844,{pos:pos()});send('touchstart',400);send('touchmove',200);send('touchend',200,0);await sleep(500);check('touch while locked does not skip',pos()===844,{pos:pos()});send('touchstart',300);send('touchmove',335);send('touchend',335,0);await sleep(800);check('reverse touch previous page',pos()===0,{pos:pos()});send('touchstart',400);send('touchmove',397);send('touchend',397,0);await sleep(800);check('tiny touch returns to boundary',pos()===0,{pos:pos()});await size(320,568,2);const zoomCount=inspect().count;f.contentDocument.documentElement.style.fontSize='16px';await sleep(600);check('text reset recombines pages',inspect().count<zoomCount,{before:zoomCount,after:inspect().count});r.textContent='TOUCH DONE\n'+JSON.stringify(log,null,2)};
</script><script>document.querySelector('#focuscheck').onclick=async()=>{await size(320,568,2);const d=f.contentDocument,w=f.contentWindow;d.querySelector('#tab-assistance').focus();const before=d.activeElement.id;d.documentElement.style.fontSize='16px';await sleep(600);const after=d.activeElement.id;const screen=d.activeElement.closest('.screen');r.textContent=JSON.stringify({focusPreserved:before===after&&after==='tab-assistance',focusedPageAligned:screen?.getBoundingClientRect().top===0,after,...inspect()},null,2)};</script>
